<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Pitch Demo Interface</title>
  <style>
    :root {
      --primary-color: #2c3e50;
      --secondary-color: #3498db;
      --background-color: #ecf0f1;
      --text-color: #2c3e50;
    }

    body {
      margin: 0;
      padding: 0;
      font-family: 'Arial', sans-serif;
      background-color: var(--background-color);
      color: var(--text-color);
    }

    .header {
      background-color: var(--primary-color);
      color: white;
      padding: 20px;
      text-align: center;
    }

    .hero-section {
      padding: 40px 20px;
      text-align: center;
      background-color: var(--secondary-color);
      color: white;
    }

    .chatbot-section {
      max-width: 800px;
      margin: 20px auto;
      padding: 20px;
      background-color: white;
      border-radius: 10px;
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
    }

    .chatbot-toggle {
      background-color: var(--secondary-color);
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 5px;
      cursor: pointer;
      font-size: 16px;
    }

    .chatbot-window {
      display: none;
      margin-top: 20px;
      border: 1px solid #ddd;
      border-radius: 5px;
      padding: 20px;
    }

    .chatbot-header {
      background-color: var(--secondary-color);
      color: white;
      padding: 10px;
      border-radius: 5px 5px 0 0;
    }

    .chat-messages {
      height: 300px;
      overflow-y: auto;
      padding: 10px;
      border: 1px solid #ddd;
      border-radius: 5px;
      margin: 10px 0;
    }

    .message-input {
      width: 100%;
      padding: 10px;
      border: 1px solid #ddd;
      border-radius: 5px;
      margin-top: 10px;
    }

    #recordBtn {
      margin-top: 10px;
      padding: 10px 15px;
      background-color: var(--primary-color);
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>Pitch Demo Interface</h1>
  </div>

  <div class="hero-section">
    <h2>Our Product: AI-Powered Solutions</h2>
    <p>Transform your business with our innovative AI solutions</p>
  </div>

  <div class="chatbot-section">
    <button class="chatbot-toggle" onclick="toggleChatbot()">Chat with our AI Assistant</button>
    <div class="chatbot-window" id="chatbotWindow">
      <div class="chatbot-header">
        <h3>AI Assistant</h3>
      </div>
      <div class="chat-messages" id="chatMessages">
        <p><strong>AI:</strong> Hello! How can I assist you today?</p>
      </div>
      <input type="text" class="message-input" placeholder="Type your message here..." id="userInput">
      <button id="recordBtn">Record Voice</button>
    </div>
  </div>

  <audio id="audioPlayer" controls style="display:none;"></audio>

  <script>
    function toggleChatbot() {
      const chatbotWindow = document.getElementById('chatbotWindow');
      chatbotWindow.style.display = chatbotWindow.style.display === 'none' ? 'block' : 'none';
    }

    const audioPlayer = document.getElementById('audioPlayer');
    const recordBtn = document.getElementById('recordBtn');
    const userInput = document.getElementById('userInput');
    const chatMessages = document.getElementById('chatMessages');
    const BACKEND_URL = 'https://mind-aid.onrender.com';

    userInput.addEventListener('keypress', async function (e) {
      if (e.key === 'Enter' && this.value.trim() !== '') {
        const message = this.value.trim();
        chatMessages.innerHTML += `<p><strong>You:</strong> ${message}</p>`;
        this.value = '';
        await sendTextToBackend(message);
      }
    });

    async function sendTextToBackend(message) {
      try {
        const response = await fetch(`${BACKEND_URL}/chat`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ user_input: message })
        });

        const data = await response.json();
        chatMessages.innerHTML += `<p><strong>AI:</strong> ${data.response_text}</p>`;

        if (data.audio_url) {
          audioPlayer.src = `${BACKEND_URL}${data.audio_url}`;
          audioPlayer.style.display = 'block';
          audioPlayer.play();
        }

        chatMessages.scrollTop = chatMessages.scrollHeight;
      } catch (error) {
        console.error('Text Error:', error);
        chatMessages.innerHTML += `<p><strong>AI:</strong> Something went wrong. Please try again.</p>`;
      }
    }

    let mediaRecorder;
    let audioChunks = [];

    recordBtn.addEventListener('click', async () => {
      if (!mediaRecorder || mediaRecorder.state === 'inactive') {
        try {
          const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
          mediaRecorder = new MediaRecorder(stream);
          mediaRecorder.start();
          audioChunks = [];
          recordBtn.textContent = 'Recording... Click to Stop';

          mediaRecorder.ondataavailable = (e) => audioChunks.push(e.data);

          mediaRecorder.onstop = async () => {
            const audioBlob = new Blob(audioChunks, { type: 'audio/wav' });
            const formData = new FormData();
            formData.append('audio', audioBlob, 'input.wav');

            try {
              const response = await fetch(`${BACKEND_URL}/chat`, {
                method: 'POST',
                body: formData
              });

              const data = await response.json();

              chatMessages.innerHTML += `<p><strong>You (voice):</strong> [Voice message]</p>`;
              chatMessages.innerHTML += `<p><strong>AI:</strong> ${data.response_text}</p>`;

              if (data.audio_url) {
                audioPlayer.src = `${BACKEND_URL}${data.audio_url}`;
                audioPlayer.style.display = 'block';
                audioPlayer.play();
              }

              chatMessages.scrollTop = chatMessages.scrollHeight;
            } catch (error) {
              console.error('Voice Error:', error);
              chatMessages.innerHTML += `<p><strong>AI:</strong> Voice processing failed.</p>`;
            }

            recordBtn.textContent = 'Record Voice';
          };
        } catch (error) {
          console.error('Microphone access error:', error);
          chatMessages.innerHTML += `<p><strong>System:</strong> Could not access microphone. Please check your browser permissions.</p>`;
          recordBtn.textContent = 'Record Voice';
        }
      } else {
        mediaRecorder.stop();
      }
    });
  </script>
</body>
</html>
